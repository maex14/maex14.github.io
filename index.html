<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accès ordinateur</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#000;
  font-family:Arial, sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:#111;
  padding:40px;
  border-radius:16px;
  width:340px;
  text-align:center;
  box-shadow:0 0 30px rgba(255,255,255,0.05);
}

h1{
  font-size:26px;
  margin-bottom:10px;
}

p{
  font-size:14px;
  opacity:0.7;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  margin-bottom:15px;
  background:#222;
  color:#fff;
  font-size:18px;
  text-align:center;
  letter-spacing:2px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  opacity:0.8;
}
</style>
</head>

<body>

<div class="container">
  <h1>Entrer un code</h1>
  <p>Entrez le code affiché sur votre ordinateur</p>

  <form id="loginForm">
    <input type="text" placeholder="XXXX-XXXX" required>
    <button type="submit">Se connecter</button>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault(); // bloque le refresh
  window.location.href = "dashboard.html"; // redirection
});
</script>

</body>
</html>
